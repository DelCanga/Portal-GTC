<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>GESTÃO & TALENTO · Portal de Carreira</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #0f3b5c;
            --primary-dark: #0a2a42;
            --primary-light: #1a5a8a;
            --accent: #2c7da0;
            --gold: #d4af37;
            --success: #2e7d32;
            --danger: #c62828;
            --warning: #f57c00;
            --info: #0288d1;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 20px;
            --radius-xl: 24px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
            --transition: 0.25s ease;
        }


        body.dark {
            --primary: #1a6b9e;
            --primary-dark: #0f4a6e;
            --primary-light: #2a8bc4;
            --gray-50: #1a1a2e;
            --gray-100: #16213e;
            --gray-200: #1f2a4a;
            --gray-300: #2a3a5a;
            --gray-400: #4a5a7a;
            --gray-500: #7a8aaa;
            --gray-600: #9aaac0;
            --gray-700: #c0cce0;
            --gray-800: #e0e8f0;
            --gray-900: #f0f4f8;
        }


        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e8eef5 100%);
            background-attachment: fixed;
            color: var(--gray-800);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        body.dark { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }


        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .hidden { display: none !important; }
        
        .card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 24px;
            transition: all var(--transition);
            border: 1px solid var(--gray-200);
        }
        body.dark .card { background: rgba(30, 41, 59, 0.95); }
        .card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        
        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            border: 2px solid var(--gray-200);
            background: white;
            transition: all var(--transition);
            margin-bottom: 12px;
        }
        body.dark input, body.dark select, body.dark textarea {
            background: var(--gray-800);
            color: var(--gray-200);
            border-color: var(--gray-600);
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(15,59,92,0.1);
        }
        
        button {
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        button.primary { background: var(--primary); color: white; }
        button.primary:hover { background: var(--primary-dark); transform: translateY(-2px); }
        button.success { background: var(--success); color: white; }
        button.success:hover { background: #1b5e20; transform: translateY(-2px); }
        button.danger { background: var(--danger); color: white; }
        button.warning { background: var(--warning); color: white; }
        button.secondary { background: var(--gray-100); color: var(--gray-700); border: 2px solid var(--gray-200); }
        button.info { background: var(--info); color: white; }
        
        /* CABEÇALHO - SEMPRE HORIZONTAL E FIXO */
        .header-fixo-reformulado {
            background: white;
            color: var(--primary-dark);
            padding: 8px 16px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--primary-light);
            box-shadow: var(--shadow-sm);
        }
        body.dark .header-fixo-reformulado {
            background: var(--gray-800);
            color: white;
            border-bottom-color: var(--primary);
        }
        .header-reformulado-container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }
        .header-reformulado-container .linha1 {
            font-size: 0.9rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .header-reformulado-container .linha2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            padding: 4px 0;
            border-top: 1px solid rgba(0,0,0,0.05);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            flex-direction: row !important;
            flex-wrap: wrap;
            gap: 8px;
        }
        body.dark .header-reformulado-container .linha2 {
            border-top-color: rgba(255,255,255,0.1);
            border-bottom-color: rgba(255,255,255,0.1);
        }
        .header-reformulado-container .linha3 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            padding: 4px 0;
            gap: 12px;
            flex-direction: row !important;
            flex-wrap: wrap;
        }
        .header-reformulado-container .linha3 span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        /* Estilo para o saldo no cabeçalho */
        .saldo-header {
            background: var(--success);
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.7rem;
            white-space: nowrap;
        }
        body.dark .saldo-header {
            background: #1b5e20;
        }
        
        .nav-bar {
            background: white;
            border-bottom: 1px solid var(--gray-200);
            overflow-x: auto;
            position: sticky;
            top: 72px;
            z-index: 999;
        }
        body.dark .nav-bar { background: var(--gray-800); }
        .nav-tabs { 
            display: flex;
            gap: 4px;
            padding: 8px 16px;
            max-width: 100%;
            margin: 0 auto;
            flex-wrap: nowrap;
            overflow-x: auto;
        }
        .nav-tab {
            background: var(--gray-100);
            padding: 10px 20px;
            font-weight: 600;
            cursor: pointer;
            color: var(--gray-700);
            border-radius: 30px;
            text-align: center;
            transition: all var(--transition);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        body.dark .nav-tab { background: var(--gray-700); color: var(--gray-200); }
        .nav-tab:hover { background: var(--primary); color: white; }
        .nav-tab.ativo { background: var(--primary); color: white; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin: 20px 0;
        }
        .stat-card {
            background: var(--gray-50);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            border: 2px solid transparent;
        }
        .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--primary); }
        .stat-valor { font-size: 32px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
        .stat-label { font-size: 11px; color: var(--gray-500); text-transform: uppercase; font-weight: 600; }
        
        .abas-internas {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            border-bottom: 2px solid var(--gray-200);
            padding-bottom: 12px;
        }
        .aba-interna {
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            background: var(--gray-100);
            transition: all var(--transition);
        }
        .aba-interna.ativa { background: var(--primary); color: white; }
        
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
        
        .treinamento-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .treinamento-card {
            background: white;
            border-radius: var(--radius-md);
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            border: 2px solid var(--gray-200);
        }
        body.dark .treinamento-card { background: var(--gray-700); }
        .treinamento-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--primary); }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }
        .modal-content {
            background: white;
            border-radius: var(--radius-xl);
            max-width: 800px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px;
        }
        body.dark .modal-content { background: var(--gray-800); color: var(--gray-200); }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--gray-200);
        }
        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--gray-100);
            border: none;
            cursor: pointer;
            font-size: 18px;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: var(--gray-50);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 350px;
        }
        .chat-msg { display: flex; max-width: 75%; }
        .chat-msg.sent { align-self: flex-end; }
        .chat-msg.received { align-self: flex-start; }
        .chat-bubble {
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 13px;
            line-height: 1.4;
        }
        .chat-msg.sent .chat-bubble { background: var(--primary); color: white; border-bottom-right-radius: 4px; }
        .chat-msg.received .chat-bubble { background: white; border: 1px solid var(--gray-200); border-bottom-left-radius: 4px; }
        body.dark .chat-msg.received .chat-bubble { background: var(--gray-700); border-color: var(--gray-600); }
        .chat-input-row { display: flex; gap: 8px; margin-top: 12px; }
        .chat-input-row input { flex: 1; margin: 0; border-radius: 30px; }
        
        .ranking-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            border-bottom: 1px solid var(--gray-200);
        }
        .ranking-position {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
        }
        .ranking-position.top1 { background: var(--gold); color: var(--gray-900); }
        .ranking-position.top2 { background: #c0c0c0; color: var(--gray-900); }
        .ranking-position.top3 { background: #cd7f32; color: white; }
        
        .curriculo-moderno {
            background: #e8f0fe;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }
        .curriculo-header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: white;
            padding: 30px 24px;
            text-align: center;
        }
        .curriculo-header h2 { font-size: 28px; margin-bottom: 8px; }
        .curriculo-body { padding: 24px; }
        .curriculo-secao {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--gray-300);
            padding-bottom: 16px;
        }
        .curriculo-secao:last-child { border-bottom: none; }
        .curriculo-secao h3 {
            color: var(--primary);
            font-size: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .curriculo-linha {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px dashed var(--gray-300);
        }
        .curriculo-linha-label {
            width: 140px;
            font-weight: 600;
            color: var(--gray-700);
        }
        .curriculo-linha-valor { flex: 1; color: var(--gray-800); }
        
        .curriculo-card-horizontal {
            background: white;
            border-radius: var(--radius-sm);
            padding: 12px;
            margin-bottom: 8px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            border: 1px solid var(--gray-200);
        }
        
        .campo-composto {
            display: grid;
            grid-template-columns: 2fr 2fr 1fr auto;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        
        .candidatura-item {
            background: var(--gray-50);
            border-radius: var(--radius-sm);
            padding: 12px;
            margin-bottom: 8px;
            border-left: 3px solid var(--primary);
        }
        
        .pagamento-opcoes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin: 20px 0;
        }
        .pagamento-card {
            background: var(--gray-100);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            border: 2px solid transparent;
        }
        .pagamento-card:hover { transform: translateY(-4px); border-color: var(--primary); background: var(--gray-200); }
        .pagamento-preco { font-size: 24px; font-weight: 800; color: var(--primary); }
        
        .vaga-group {
            margin-bottom: 24px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-md);
            overflow: hidden;
        }
        .vaga-header {
            background: var(--primary);
            color: white;
            padding: 12px 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .vaga-candidatos {
            padding: 12px;
            background: var(--gray-50);
        }
        
        .perfil-foto {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            margin: 0 auto 16px;
            font-size: 40px;
        }
        
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            background: var(--gray-900);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            animation: fadeIn 0.3s ease, fadeOut 0.3s ease 2.5s forwards;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(20px); } }
        
        .float-group {
            position: fixed;
            bottom: 80px;
            right: 20px;
            z-index: 1500;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }
        .float-main {
            width: 48px;
            height: 48px;
            border-radius: 24px;
            background: var(--primary);
            color: white;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            cursor: pointer;
        }
        .float-sub {
            width: 42px;
            height: 42px;
            border-radius: 21px;
            background: white;
            border: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            cursor: pointer;
            transition: all var(--transition);
        }
        .float-sub:hover { transform: scale(1.05); }
        .hidden-group { display: none !important; }
        
        .marketing-card {
            border: 2px solid var(--primary-dark);
            background: white;
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 20px;
            text-align: center;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        body.dark .marketing-card { background: var(--gray-800); }
        
        .slideshow-container {
            position: relative;
            width: 100%;
            height: 200px;
            margin: 12px auto;
            overflow: hidden;
            border-radius: var(--radius-md);
        }
        .slideshow-slide { display: none; width: 100%; height: 100%; }
        .slideshow-slide.active { display: block; }
        .slideshow-slide img, .slideshow-slide video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: var(--radius-md);
        }
        
        .lista-usuarios {
            max-height: 400px;
            overflow-y: auto;
        }
        .usuario-linha {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid var(--gray-200);
            font-size: 13px;
        }
        .usuario-linha:hover { background: var(--gray-100); }
        
        .footer {
            background: var(--gray-900);
            color: white;
            padding: 8px 16px;
            text-align: center;
            font-size: 10px;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
        }
        .footer-noticias {
            font-size: 11px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .flex { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .flex-col { display: flex; flex-direction: column; gap: 12px; }
        .text-center { text-align: center; }
        .mt-1 { margin-top: 8px; }
        .mt-2 { margin-top: 16px; }
        .mt-3 { margin-top: 24px; }
        .mb-1 { margin-bottom: 8px; }
        .mb-2 { margin-bottom: 16px; }
        .w-auto { width: auto !important; }
        
        .vagas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .vaga-card {
            background: var(--gray-50);
            border-radius: var(--radius-md);
            padding: 20px;
            border-left: 4px solid var(--primary);
        }
        .vaga-card.candidatada {
            border-left-color: var(--success);
            opacity: 0.8;
        }
        
        .quiz-pergunta {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 20px;
            padding: 16px;
            background: var(--gray-100);
            border-radius: var(--radius-md);
        }
        .quiz-opcao {
            padding: 12px 16px;
            margin: 8px 0;
            background: var(--gray-50);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--gray-200);
        }
        .quiz-opcao:hover { background: var(--gray-200); transform: translateX(4px); }
        .quiz-opcao.selecionada {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        /* Ecrãs pequenos - mantém horizontal apenas com ajuste de fontes */
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .modal-content { margin: auto; max-height: 90vh; }
            .campo-composto { grid-template-columns: 1fr; gap: 4px; }
            .curriculo-card-horizontal { grid-template-columns: 1fr; gap: 4px; }
            .nav-tabs { padding: 8px; }
            .nav-tab { padding: 8px 12px; font-size: 12px; }
            .header-reformulado-container .linha2,
            .header-reformulado-container .linha3 {
                font-size: 0.65rem;
                gap: 6px;
                justify-content: space-between;
            }
            .header-reformulado-container .linha1 {
                font-size: 0.8rem;
            }
            .saldo-header {
                font-size: 0.65rem;
                padding: 2px 5px;
            }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <!-- CABEÇALHO - SEMPRE HORIZONTAL -->
        <div class="header-fixo-reformulado" id="mainHeader" style="display:none">
            <div class="header-reformulado-container">
                <div class="linha1">PORTAL DE GESTÃO & CARREIRA</div>
                <div class="linha2">
                    <span id="perfilNome">👤 Perfil</span>
                    <span id="data-hora">15/04/2025 14:30:00</span>
                </div>
                <div class="linha3">

        // Função para salvar backup na nuvem (não causa loop)
        async function salvarBackupNuvem() {
            if (sincronizando) return;
            sincronizando = true;
            
            try {
                const backupData = {
                    usuarios: usuariosDB,
                    candidaturas: candidaturasDB,
                    vagas: vagasDB,
                    servicos: servicosDB,
                    pagamentos: pagamentosDB,
                    noticias: noticiasDB,
                    slides: slidesMarketingDB,
                    estatisticas: estatisticasPortal,
                    timestamp: new Date().toISOString()

                await fetch(SCRIPT_URL + '?action=backup&dados=' + encodeURIComponent(JSON.stringify(backupData)), {
                    method: 'GET',
                    mode: 'no-cors'
                });
                
                console.log('💾 Backup enviado para a nuvem');
            } catch (erro) {
                console.error('Erro no backup:', erro);
            } finally {
                sincronizando = false;
            }
        }

            { nome: 'INTERMÉDIO', min: 21, max: 40, cor: '#FFA726' },
            { nome: 'AVANÇADO', min: 41, max: 60, cor: '#EF5350' },
            { nome: 'PROFISSIONAL', min: 61, max: 80, cor: '#FFD700' },
            { nome: 'PERITO', min: 81, max: 100, cor: '#9C27B0' }
        ];


        function getNivelPorPercentual(pontos) {
            for (const nivel of niveisLista) {
                if (pontos >= nivel.min && pontos <= nivel.max) return nivel;
            }
            return niveisLista[0];
        }


        function calcularPontosTotal(candId) {
            let total = 0;
            if (atividadesRealizadas[candId]) {
                Object.values(atividadesRealizadas[candId]).forEach(val => total += val);
            }
            return Math.min(100, total);
        }


        function podeFazerTreino(candId, tipoTreino) {
            const hoje = new Date().toDateString();
            const key = `${candId}_${tipoTreino}`;
            return treinosDiarios[key] !== hoje;
        }


        function marcarTreinoFeito(candId, tipoTreino) {
            const hoje = new Date().toDateString();
            const key = `${candId}_${tipoTreino}`;
            treinosDiarios[key] = hoje;
            persistir();
        }


        function addPontosAtividade(candId, atividadeId, valor = 0.5, isCorrect = true) {
            if (!atividadesRealizadas[candId]) atividadesRealizadas[candId] = {};
            if (!atividadesRealizadas[candId][atividadeId]) atividadesRealizadas[candId][atividadeId] = 0;
            atividadesRealizadas[candId][atividadeId] += valor;
            const pontosTotal = calcularPontosTotal(candId);
            const cand = candidaturasDB.find(c => c.id === candId);
            if (cand) {
                cand.pontos = pontosTotal;
                cand.nivel = getNivelPorPercentual(pontosTotal).nome;
                persistir();
                if (isCorrect) estatisticasPortal.acertos++;
                else estatisticasPortal.erros++;
                estatisticasPortal.treinosUsados++;
                persistir();
            }
            return pontosTotal;
        }

                dataHoraElement.textContent = now.toLocaleDateString('pt-AO') + ' ' + now.toLocaleTimeString('pt-AO');

                const diff = Math.floor((Date.now() - inicioSessao) / 1000);
                const horas = Math.floor(diff / 3600);
                const minutos = Math.floor((diff % 3600) / 60);
                const segundos = diff % 60;
                tempoLoginElement.innerHTML = `⏱️ Tempo: ${horas.toString().padStart(2,'0')}:${minutos.toString().padStart(2,'0')}:${segundos.toString().padStart(2,'0')}`;

                persistir();

            menuDiv.querySelectorAll('.nav-tab').forEach(tab => {

        // ==================== ADMIN DASHBOARD ====================
        function adminDashboard() {
            const stats = {};
            niveisLista.forEach(n => stats[n.nome] = candidaturasDB.filter(c => getNivelPorPercentual(c.pontos || 0).nome === n.nome).length);
            
            let receitas = { saldo: 0, servicos: 0 };
            pagamentosDB.filter(p => p.status === 'aprovado').forEach(p => {
                if (p.tipoPagamento === 'saldo') receitas.saldo += p.valor;
                else receitas.servicos += p.valor;
            });
            
            const totalCandidatos = candidaturasDB.length;
            const totalCompletaram = candidaturasDB.filter(c => c.pontos >= 80).length;
            const taxaConclusao = totalCandidatos > 0 ? ((totalCompletaram / totalCandidatos) * 100).toFixed(1) : 0;
            
            document.getElementById('adminView').innerHTML = `
                <div class="card">
                    <h3><i class="fas fa-chart-simple"></i> NÍVEIS DOS CANDIDATOS</h3>
                    <div class="stats-grid">
                        ${niveisLista.map(n => `<div class="stat-card" onclick="adminFiltrarPorNivel('${n.nome}')" style="border-left:4px solid ${n.cor}"><div class="stat-valor">${stats[n.nome] || 0}</div><div class="stat-label">${n.nome}<br><span style="font-size:10px">${n.min}%-${n.max}%</span></div></div>`).join('')}
                    </div>
                    
                    <h3 class="mt-3"><i class="fas fa-chart-line"></i> BALANÇO FINANCEIRO</h3>
                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-valor">${formatMoney(receitas.saldo || 0)} Kz</div><div class="stat-label">RECARGAS</div></div>
                        <div class="stat-card"><div class="stat-valor">${formatMoney(receitas.servicos || 0)} Kz</div><div class="stat-label">SERVIÇOS</div></div>
                    </div>
                    
                    <h3 class="mt-3"><i class="fas fa-chart-simple"></i> ESTATÍSTICAS</h3>
                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-valor">${estatisticasPortal.acessos || 0}</div><div class="stat-label">ACESSOS</div></div>
                        <div class="stat-card"><div class="stat-valor">${Math.floor(estatisticasPortal.tempoTotalMinutos || 0)} min</div><div class="stat-label">TEMPO TOTAL</div></div>
                        <div class="stat-card"><div class="stat-valor">${estatisticasPortal.treinosUsados || 0}</div><div class="stat-label">TREINOS</div></div>
                        <div class="stat-card"><div class="stat-valor">${estatisticasPortal.acertos || 0}</div><div class="stat-label">ACERTOS</div></div>
                        <div class="stat-card"><div class="stat-valor">${estatisticasPortal.erros || 0}</div><div class="stat-label">ERROS</div></div>
                        <div class="stat-card"><div class="stat-valor">${taxaConclusao}%</div><div class="stat-label">TAXA CONCLUSÃO</div></div>
                    </div>
                    
                    <canvas id="graficoDashboard" style="max-height:300px;margin-top:20px"></canvas>
                </div>
            `;
            
            setTimeout(() => {
                const canvas = document.getElementById('graficoDashboard');
                if (canvas) {
                    new Chart(canvas, {
                        type: 'bar',
                        data: {
                            labels: niveisLista.map(n => n.nome),
                            datasets: [{
                                label: 'Candidatos por Nível',
                                data: Object.values(stats),
                                backgroundColor: niveisLista.map(n => n.cor),
                                borderRadius: 12
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: true }
                    });
                }
            }, 100);
        }

        // ==================== ADMIN SOLICITAÇÕES DE SERVIÇOS ====================

            const rejeitadas = solicitacoesServicos.filter(s => s.status === 'rejeitado');
            
            document.getElementById('adminView').innerHTML = `
                <div class="card">
                    <h3><i class="fas fa-clipboard-list"></i> SOLICITAÇÕES DE SERVIÇOS</h3>

                        <button class="aba-interna" data-aba="aprovadas"><i class="fas fa-check-circle"></i> Aprovadas (${aprovadas.length})</button>
                        <button class="aba-interna" data-aba="rejeitadas"><i class="fas fa-times-circle"></i> Rejeitadas (${rejeitadas.length})</button>

                    else if (abaSelecionada === 'aprovadas') lista = aprovadas;
                    else lista = rejeitadas;

                        div.innerHTML = '<p class="text-center">Nenhuma solicitação encontrada</p>';

                    }
                    
                    div.innerHTML = lista.map(s => `

                            <div style="display:flex; justify-content:space-between; width:100%;">
                                <div><strong><i class="fas fa-user"></i> Solicitante:</strong> ${s.solicitanteNome} (${s.solicitanteTipo})</div>
                                <div><strong><i class="fas fa-calendar"></i> Data:</strong> ${new Date(s.data).toLocaleDateString()}</div>
                            </div>
                            <div><strong><i class="fas fa-cogs"></i> Serviço:</strong> ${s.servicoNome}</div>

                            <div><strong><i class="fas fa-align-left"></i> Descrição:</strong> ${s.descricao || '-'}</div>

                                    <button class="success w-auto" onclick="aprovarServicoAdmin(${s.id})"><i class="fas fa-check"></i> Aprovar</button>
                                    <button class="danger w-auto" onclick="rejeitarServicoAdmin(${s.id})"><i class="fas fa-times"></i> Rejeitar</button>
                                </div>
                            ` : `
                                <div><strong><i class="fas ${s.status === 'aprovado' ? 'fa-check-circle' : 'fa-times-circle'}"></i> Status:</strong> 
                                ${s.status === 'aprovado' ? '<span style="color:green">Aprovado</span>' : '<span style="color:red">Rejeitado</span>'}</div>
                            `}
                        </div>
                    `).join('');
                });
            });
            document.querySelector('.aba-interna.ativa').click();
        }
        
        window.aprovarServicoAdmin = function(id) {
            const solicitacao = solicitacoesServicos.find(s => s.id === id);
            if (solicitacao) {
                solicitacao.status = 'aprovado';
                persistir();
                toast('Solicitação de serviço aprovada!', 'success');
                adminSolicitacoesServicos();
            }
        };
        
        window.rejeitarServicoAdmin = function(id) {
            const solicitacao = solicitacoesServicos.find(s => s.id === id);
            if (solicitacao) {
                solicitacao.status = 'rejeitado';
                persistir();
                toast('Solicitação de serviço rejeitada!', 'error');
                adminSolicitacoesServicos();
            }
        };


        // ==================== FUNÇÕES ADICIONAIS ====================
        window.adminFiltrarPorNivel = function(nivel) {
            const candidatos = candidaturasDB.filter(c => getNivelPorPercentual(c.pontos || 0).nome === nivel);
            const modal = document.createElement('div'); modal.className = 'modal-overlay';
            modal.innerHTML = `<div class="modal-content"><div class="modal-header"><h3><i class="fas fa-users"></i> CANDIDATOS - ${nivel}</h3><button class="modal-close"><i class="fas fa-times"></i></button></div><div class="lista-usuarios">${candidatos.map(c => `<div class="usuario-linha"><span><strong>${c.nomeCompleto}</strong> | ${c.sectorEscolhido || '-'}</span><button class="primary w-auto" style="padding:4px 12px;font-size:11px" onclick="verPerfilAdmin(${c.id})"><i class="fas fa-eye"></i> Ver</button></div>`).join('') || '<p>Nenhum candidato</p>'}</div></div>`;
            document.body.appendChild(modal);
            modal.querySelector('.modal-close').onclick = () => modal.remove();

        window.verPerfilAdmin = function(id) {

            modal.innerHTML = `<div class="modal-content"><div class="modal-header"><h3>${cand.nomeCompleto}</h3><button class="modal-close"><i class="fas fa-times"></i></button></div><p><strong><i class="fas fa-briefcase"></i> Setor:</strong> ${cand.sectorEscolhido || '-'}</p><p><strong><i class="fas fa-phone"></i> Contacto:</strong> ${cand.contacto || '-'}</p><p><strong><i class="fas fa-envelope"></i> Email:</strong> ${cand.email || '-'}</p><p><strong><i class="fas fa-star"></i> Nível:</strong> ${cand.nivel} (${cand.pontos || 0}%)</p><p><strong><i class="fas fa-coins"></i> Saldo:</strong> ${cand.saldo || 0} Kz</p><div class="flex mt-2"><button class="success" onclick="contactarCandidato(${cand.id},'${cand.nomeCompleto}');this.closest('.modal-overlay').remove()"><i class="fas fa-comment"></i> Contactar</button><button class="warning" onclick="darBonusAdmin(${cand.id})"><i class="fas fa-gift"></i> Bónus</button></div></div>`;
            document.body.appendChild(modal);
            modal.querySelector('.modal-close').onclick = () => modal.remove();
        };

        function adminUsuarios() {
            document.getElementById('adminView').innerHTML = `
                <div class="card">
                    <div class="abas-internas">
                        <button class="aba-interna ativa" data-aba="candidatos"><i class="fas fa-user-graduate"></i> CANDIDATOS</button>
                        <button class="aba-interna" data-aba="recrutadores"><i class="fas fa-building"></i> RECRUTADORES</button>
                        <button class="aba-interna" data-aba="parceiros"><i class="fas fa-handshake"></i> PARCEIROS</button>
                    </div>
                    <div id="adminUsuariosConteudo"></div>
                </div>
            `;
            document.querySelectorAll('.aba-interna').forEach(aba => {
                aba.addEventListener('click', function() {
                    document.querySelectorAll('.aba-interna').forEach(a => a.classList.remove('ativa'));
                    this.classList.add('ativa');
                    renderAdminUsuarios(this.dataset.aba);
                });
            });
            renderAdminUsuarios('candidatos');
        }
        
        function renderAdminUsuarios(tipo) {
            const div = document.getElementById('adminUsuariosConteudo');
            if (tipo === 'candidatos') {
                div.innerHTML = `<div class="lista-usuarios">${candidaturasDB.map(c => `<div class="usuario-linha"><span><strong>${c.nomeCompleto || '-'}</strong> | ${c.usuario} | ${c.nivel} | ${formatMoney(c.saldo || 0)} Kz</span><div class="flex" style="gap:4px"><button class="warning w-auto" style="padding:4px 8px;font-size:11px" onclick="darBonusAdmin(${c.id})"><i class="fas fa-gift"></i></button><button class="danger w-auto" style="padding:4px 8px;font-size:11px" onclick="toggleBloqueioUsuario('${c.usuario}','Candidato')">${c.bloqueado ? '<i class="fas fa-unlock"></i>' : '<i class="fas fa-lock"></i>'}</button><button class="danger w-auto" style="padding:4px 8px;font-size:11px" onclick="excluirUsuario('${c.usuario}','Candidato')"><i class="fas fa-trash"></i></button></div></div>`).join('')}</div>`;
            } else if (tipo === 'recrutadores') {
                const recs = usuariosDB.filter(u => u.tipo === 'Recrutador');
                div.innerHTML = `<div class="lista-usuarios">${recs.map(r => `<div class="usuario-linha"><span><strong>${r.nome || '-'}</strong> | ${r.usuario}</span><div class="flex" style="gap:4px"><button class="danger w-auto" style="padding:4px 8px;font-size:11px" onclick="toggleBloqueioUsuario('${r.usuario}','Recrutador')">${r.bloqueado ? '<i class="fas fa-unlock"></i>' : '<i class="fas fa-lock"></i>'}</button><button class="danger w-auto" style="padding:4px 8px;font-size:11px" onclick="excluirUsuario('${r.usuario}','Recrutador')"><i class="fas fa-trash"></i></button></div></div>`).join('')}</div>`;
            } else {
                div.innerHTML = `<div class="lista-usuarios">${parceirosDB.map(p => `<div class="usuario-linha"><span><strong>${p.nome}</strong> | ${p.nif}</span><div class="flex" style="gap:4px"><button class="danger w-auto" style="padding:4px 8px;font-size:11px" onclick="removerParceiro(${p.id})"><i class="fas fa-trash"></i></button></div></div>`).join('')}<button class="success mt-2 w-auto" onclick="adicionarParceiro()"><i class="fas fa-plus"></i> Adicionar</button></div>`;
            }
        }
        
        window.toggleBloqueioUsuario = function(usuario, tipo) {
            const user = usuariosDB.find(u => u.usuario === usuario);
            if (user) user.bloqueado = !user.bloqueado;
            const cand = candidaturasDB.find(c => c.usuario === usuario);
            if (cand) cand.bloqueado = !cand.bloqueado;
            persistir();
            toast(user?.bloqueado ? 'Usuário bloqueado' : 'Usuário ativado', user?.bloqueado ? 'error' : 'success');
            adminUsuarios();
        };
        
        window.excluirUsuario = function(usuario, tipo) {
            if (confirm(`Excluir ${tipo}?`)) {
                usuariosDB = usuariosDB.filter(u => u.usuario !== usuario);
                if (tipo === 'Candidato') candidaturasDB = candidaturasDB.filter(c => c.usuario !== usuario);
                persistir();
                toast(`${tipo} excluído!`, 'success');
                adminUsuarios();
            }
        };
        
        window.adicionarParceiro = function() {
            const modal = document.createElement('div'); modal.className = 'modal-overlay';
            modal.innerHTML = `<div class="modal-content"><div class="modal-header"><h3><i class="fas fa-plus"></i> NOVO PARCEIRO</h3><button class="modal-close"><i class="fas fa-times"></i></button></div><input id="parcNome" placeholder="Empresa"><input id="parcNif" placeholder="NIF"><div class="flex mt-2"><button class="success" id="salvarParceiro"><i class="fas fa-save"></i> Salvar</button><button class="secondary" id="cancelarParceiro"><i class="fas fa-times"></i> Cancelar</button></div></div>`;
            document.body.appendChild(modal);
            modal.querySelector('#salvarParceiro').onclick = () => {
                parceirosDB.push({ id: Date.now(), nome: modal.querySelector('#parcNome').value, nif: modal.querySelector('#parcNif').value });
                persistir();
                toast('Parceiro adicionado!', 'success');
                modal.remove();
                adminUsuarios();
            };
            modal.querySelector('.modal-close').onclick = () => modal.remove();
        };
        
        window.removerParceiro = function(id) {
            if (confirm('Remover parceiro?')) {
                parceirosDB = parceirosDB.filter(p => p.id !== id);
                persistir();
                toast('Parceiro removido!', 'success');
                adminUsuarios();
            }
        };
        
        window.darBonusAdmin = function(candId) {
            const cand = candidaturasDB.find(c => c.id === candId);
            const modal = document.createElement('div'); modal.className = 'modal-overlay';
            modal.innerHTML = `<div class="modal-content"><div class="modal-header"><h3><i class="fas fa-gift"></i> Bónus</h3><button class="modal-close"><i class="fas fa-times"></i></button></div><div class="stats-grid"><button class="success" onclick="adicionarBonusSaldo(${cand.id}, 100)"><i class="fas fa-plus"></i> +100 Kz</button><button class="success" onclick="adicionarBonusSaldo(${cand.id}, 500)"><i class="fas fa-plus"></i> +500 Kz</button><button class="success" onclick="adicionarBonusSaldo(${cand.id}, 1000)"><i class="fas fa-plus"></i> +1000 Kz</button></div></div>`;
            document.body.appendChild(modal);
            modal.querySelector('.modal-close').onclick = () => modal.remove();
        };
        
        window.adicionarBonusSaldo = function(candId, valor) {
            const cand = candidaturasDB.find(c => c.id === candId);
            if (cand) { cand.saldo = (cand.saldo || 0) + valor; persistir(); toast(`+${formatMoney(valor)} Kz!`, 'success'); document.querySelector('.modal-overlay')?.remove(); adminUsuarios(); }
            if (usuarioAtual && usuarioAtual.tipo === 'Candidato' && usuarioAtual.usuario === cand.usuario) {
                const saldoElement = document.getElementById('saldo-header');
                if (saldoElement) saldoElement.innerHTML = `💰 ${formatMoney(cand.saldo)} Kz`;
            }
        };

        function adminCandidaturas() {
            document.getElementById('adminView').innerHTML = `
                <div class="card">
                    <h3><i class="fas fa-file-signature"></i> CANDIDATURAS RECEBIDAS</h3>
                    <div class="abas-internas">
                        <button class="aba-interna ativa" data-filtro="todas">Todas as Vagas</button>

                    </div>
                    <div id="listaCandidaturasAdmin"></div>
                </div>
            `;
            document.querySelectorAll('.aba-interna').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.aba-interna').forEach(b => b.classList.remove('ativa'));
                    this.classList.add('ativa');
                    const filtro = this.dataset.filtro;
                    let candidaturas = [...candidaturasVagasDB];
                    if (filtro !== 'todas') {
                        candidaturas = candidaturas.filter(c => c.vagaId == filtro);
                    }
                    const vagasComCandidatos = {};
                    candidaturas.forEach(c => {
                        if (!vagasComCandidatos[c.vagaId]) vagasComCandidatos[c.vagaId] = [];
                        vagasComCandidatos[c.vagaId].push(c);
                    });
                    const div = document.getElementById('listaCandidaturasAdmin');
                    if (Object.keys(vagasComCandidatos).length === 0) {
                        div.innerHTML = '<p>Nenhuma candidatura encontrada para esta vaga</p>';
                        return;
                    }
                    div.innerHTML = Object.keys(vagasComCandidatos).map(vagaId => {
                        const vaga = vagasDB.find(v => v.id == vagaId);
                        const candidatosList = vagasComCandidatos[vagaId];
                        return `
                            <div class="vaga-group">
                                <div class="vaga-header">
                                    <i class="fas fa-briefcase"></i> ${vaga?.titulo || 'Vaga'} - ${vaga?.empresa || ''}
                                    <span style="float:right">${candidatosList.length} candidato(s)</span>
                                </div>
                                <div class="vaga-candidatos">
                                    ${candidatosList.map(c => {
                                        const candidato = candidaturasDB.find(cand => cand.id === c.candidatoId);
                                        return `<div class="usuario-linha" style="margin-bottom:8px">
                                            <span><strong><i class="fas fa-user"></i> ${candidato?.nomeCompleto || 'Candidato'}</strong><br><span style="font-size:11px">Candidatou-se em: ${new Date(c.data).toLocaleDateString()}</span></span>

                                        </div>`;
                                    }).join('')}
                                </div>
                            </div>
                        `;
                    }).join('');
                });
            });
            document.querySelector('.aba-interna.ativa').click();
        }

        window.abrirChatCom = function(contatoId, contatoNome) {
            const modal = document.createElement('div'); modal.className = 'modal-overlay';
            function getMensagens() { return chatMessagesDB.filter(m => (m.remetenteId === usuarioAtual.id && m.destinatarioId === contatoId) || (m.remetenteId === contatoId && m.destinatarioId === usuarioAtual.id)).sort((a, b) => a.timestamp - b.timestamp); }
            function renderMsgs() {
                const msgs = getMensagens();
                const container = modal.querySelector('#chatMsgs');
                container.innerHTML = msgs.map(m => `<div class="chat-msg ${m.remetenteId === usuarioAtual.id ? 'sent' : 'received'}"><div class="chat-bubble">${m.texto || (m.imagem ? `<img src="${m.imagem}" style="max-width:150px">` : (m.arquivo ? `<a href="${m.arquivo}" target="_blank"><i class="fas fa-paperclip"></i> ${m.nomeArquivo}</a>` : ''))}<div style="font-size:10px;margin-top:5px">${new Date(m.timestamp).toLocaleTimeString()}</div></div></div>`).join('') || '<div class="text-center"><i class="fas fa-comments"></i> Nenhuma mensagem ainda</div>';
                container.scrollTop = container.scrollHeight;
            }
            modal.innerHTML = `<div class="modal-content" style="max-width:500px;padding:0"><div style="background:var(--primary);color:white;padding:12px;display:flex;justify-content:space-between"><h4><i class="fas fa-comment"></i> ${contatoNome}</h4><span style="cursor:pointer" onclick="this.closest('.modal-overlay').remove()"><i class="fas fa-times"></i></span></div><div class="chat-messages" id="chatMsgs"></div><div class="chat-input-row" style="padding:12px"><input id="chatInput" placeholder="Digite sua mensagem..."><input type="file" id="chatFile" accept="image/*,application/pdf" style="display:none"><button class="secondary" onclick="document.getElementById('chatFile').click()"><i class="fas fa-paperclip"></i></button><button class="primary" id="sendChat"><i class="fas fa-paper-plane"></i> Enviar</button></div></div>`;
            document.body.appendChild(modal);
            renderMsgs();
            modal.querySelector('#sendChat').onclick = () => {
                const texto = modal.querySelector('#chatInput').value.trim();
                if (texto) {
                    chatMessagesDB.push({ id: Date.now(), remetenteId: usuarioAtual.id, remetenteNome: usuarioAtual.nome, destinatarioId: contatoId, destinatarioNome: contatoNome, texto, timestamp: Date.now() });
                    persistir();
                    modal.querySelector('#chatInput').value = '';
                    renderMsgs();
                }
            };
            modal.querySelector('#chatFile').onchange = function(e) {
                const file = e.target.files[0];
                if (file && file.size <= 5*1024*1024) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        chatMessagesDB.push({ id: Date.now(), remetenteId: usuarioAtual.id, remetenteNome: usuarioAtual.nome, destinatarioId: contatoId, destinatarioNome: contatoNome, arquivo: ev.target.result, nomeArquivo: file.name, timestamp: Date.now() });
                        persistir();
                        renderMsgs();
                        toast('Arquivo enviado!', 'success');
                    };
                    reader.readAsDataURL(file);
                } else toast('Arquivo muito grande (máx 5MB)', 'error');
            };
            modal.querySelector('#chatInput').onkeypress = (e) => { if (e.key === 'Enter') modal.querySelector('#sendChat').click(); };
        };
        
        window.contactarCandidato = function(id, nome) { abrirChatCom(id, nome); };

        window.selecionarPagamento = function(valor, descricao) {
            document.getElementById('valorSelecionado').value = valor;
            document.getElementById('descricaoSelecionada').value = descricao;
            toast(`Valor selecionado: ${formatMoney(valor)} Kz - ${descricao}`, 'success');
        };
        
        window.gerarRefComValor = function() {
            const valor = document.getElementById('valorSelecionado')?.value;
            if (!valor || valor == 0) {
                toast('Selecione um tipo de pagamento primeiro!', 'warning');
                return;
            }
            window.refAtual = Math.floor(100000 + Math.random() * 900000);
            toast(`Referência gerada: ${window.refAtual} - Valor: ${formatMoney(parseFloat(valor))} Kz`, 'success');
        };
        
        window.enviarPagamentoCompleto = function() {
            const file = document.getElementById('comprovativoInput').files[0];
            const valor = parseFloat(document.getElementById('valorSelecionado')?.value);
            const descricao = document.getElementById('descricaoSelecionada')?.value;
            if (!file || !window.refAtual || !valor || valor <= 0) return toast('Selecione o serviço, gere a referência e anexe o comprovativo', 'warning');
            const reader = new FileReader();
            reader.onload = function(ev) {
                solicitacoesPagamento.push({ 
                    id: Date.now(), 
                    candidatoUser: usuarioAtual.usuario, 
                    nomeCandidato: usuarioAtual.nome, 
                    referencia: window.refAtual, 
                    valor: valor, 
                    descricao: descricao,
                    comprovativo: ev.target.result, 
                    status: 'pendente', 
                    data: new Date().toISOString() 
                });
                persistir();
                toast('Solicitação de pagamento enviada! Aguarde aprovação.', 'success');
                document.getElementById('comprovativoInput').value = '';
                window.refAtual = null;
                renderCandidato();
            };
            reader.readAsDataURL(file);
        };

                valor: serv.preco,
                descricao: serv.descricao,
                detalhes: serv.detalhes,

            });

        // ==================== TREINAMENTOS ====================
        window.iniciarTreino = function(tipo, nome, tempo, candId) {
            if (!podeFazerTreino(candId, tipo)) {
                toast(`Treino de ${nome} já realizado hoje! Volte amanhã para mais treinos.`, 'warning');
                return;
            }
            const items = treinamentoDB[tipo] || [];
            if (items.length === 0) return toast('Nenhum conteúdo disponível neste treinamento', 'warning');
            let idx = 0, tempoRest = tempo, timer = null, pode = true;
            const modal = document.createElement('div'); modal.className = 'modal-overlay';
            modal.innerHTML = `<div class="modal-content"><div class="modal-header"><h3><i class="fas fa-graduation-cap"></i> ${nome} - <i class="fas fa-hourglass-half"></i> <span id="timer">${tempoRest}s</span></h3><button class="modal-close"><i class="fas fa-times"></i></button></div><div id="quizConteudo"></div><button class="primary" id="prox" disabled><i class="fas fa-forward"></i> Próximo</button></div>`;
            document.body.appendChild(modal);
            function finalizar(acertou, correta) {
                if (timer) clearInterval(timer);
                if (acertou && pode) { 
                    addPontosAtividade(candId, `${tipo}_${items[idx].id}`, 0.5, true); 
                    toast('+0.5% de progresso!', 'success'); 
                    document.getElementById('quizConteudo').innerHTML += `<div class="quiz-feedback correct" style="color:green;margin-top:10px;padding:10px;background:#e8f5e9;border-radius:8px"><i class="fas fa-check-circle"></i> ✅ Correto! ${items[idx].explicacao ? ' ' + items[idx].explicacao : ''}</div>`;
                } else if (!acertou && pode) { 
                    addPontosAtividade(candId, `${tipo}_${items[idx].id}`, 0, false); 
                    document.getElementById('quizConteudo').innerHTML += `<div class="quiz-feedback incorrect" style="color:red;margin-top:10px;padding:10px;background:#ffebee;border-radius:8px"><i class="fas fa-times-circle"></i> ❌ Resposta correta: ${correta}. ${items[idx].explicacao ? ' ' + items[idx].explicacao : ''}</div>`;
                }
                pode = false; 
                modal.querySelector('#prox').disabled = false;
            }
            function iniciarTimer() {
                if (timer) clearInterval(timer);
                timer = setInterval(() => {
                    if (tempoRest <= 0) { 
                        clearInterval(timer); 
                        if (pode) finalizar(false, items[idx].opcoes[items[idx].correta]); 
                    } else { 
                        tempoRest--; 
                        document.getElementById('timer').textContent = `${tempoRest}s`; 
                    }
                }, 1000);
            }
            function carregar() {
                if (timer) clearInterval(timer);
                tempoRest = tempo; pode = true;
                iniciarTimer();
                const item = items[idx];
                document.getElementById('quizConteudo').innerHTML = `<div class="quiz-pergunta"><i class="fas fa-question-circle"></i> ${item.pergunta}</div>${item.opcoes.map((op, i) => `<div class="quiz-opcao" data-opcao="${i}"><i class="far fa-circle"></i> ${String.fromCharCode(65+i)}. ${op}</div>`).join('')}`;
                document.querySelectorAll('.quiz-opcao').forEach(el => {
                    el.addEventListener('click', function() {
                        if (!pode) return;
                        const sel = parseInt(this.dataset.opcao);
                        if (sel === items[idx].correta) finalizar(true, '');
                        else finalizar(false, items[idx].opcoes[items[idx].correta]);
                    });
                });
                modal.querySelector('#prox').disabled = true;
            }
            carregar();
            modal.querySelector('#prox').onclick = () => { 
                if (idx+1 < items.length) { 
                    idx++; 
                    carregar(); 
                } else { 
                    if (timer) clearInterval(timer); 
                    marcarTreinoFeito(candId, tipo); 
                    toast(`🎉 Treino de ${nome} concluído! Volte amanhã para mais.`, 'success'); 
                    modal.remove(); 
                    renderCandidato(); 
                } 
            };
            modal.querySelector('.modal-close').onclick = () => { if (timer) clearInterval(timer); modal.remove(); };
        };
        
        window.iniciarTreinoVideo = function(tipo, nome, candId) {

            const items = treinamentoDB[tipo] || [];

            modal.innerHTML = `<div class="modal-content"><div class="modal-header"><h3><i class="fas fa-video"></i> ${nome}</h3><button class="modal-close"><i class="fas fa-times"></i></button></div><div id="videoConteudo"></div><button class="primary" id="prox" disabled><i class="fas fa-forward"></i> Próximo</button></div>`;

                            this.style.color = 'white';

                            addPontosAtividade(candId, `${tipo}_${item.id}_quiz`, 0, false); 
                            this.style.background = '#f44336'; 
                            this.style.color = 'white';
                            toast(`Resposta correta: ${item.quiz.opcoes[item.quiz.correta]}`, 'info');
                        }
                        modal.querySelector('#prox').disabled = false;
                    });
                });
                modal.querySelector('#prox').disabled = true;
            }
            carregar();
            modal.querySelector('#prox').onclick = () => { if (idx+1 < items.length) { idx++; carregar(); } else { marcarTreinoFeito(candId, tipo); toast('Treino de vídeos concluído!', 'success'); modal.remove(); renderCandidato(); } };

        window.iniciarTreinoPsico = function(tipo, nome, candId) {
            if (!podeFazerTreino(candId, tipo)) { toast(`Treino de ${nome} já realizado hoje! Volte amanhã.`, 'warning'); return; }
            const comp = treinamentoDB.testesPsicotecnicos.comparacao;
            const inter = treinamentoDB.testesPsicotecnicos.interpretacao;
            const band = treinamentoDB.testesPsicotecnicos.bandeiras;
            const all = [...comp.map(t=>({...t,sub:'comp'})), ...inter.map(t=>({...t,sub:'inter'})), ...band.map(t=>({...t,sub:'band'}))];
            if (all.length === 0) return toast('Nenhum teste psicotécnico disponível', 'warning');
            let idx = 0;
            const modal = document.createElement('div'); modal.className = 'modal-overlay';
            modal.innerHTML = `<div class="modal-content"><div class="modal-header"><h3><i class="fas fa-brain"></i> ${nome}</h3><button class="modal-close"><i class="fas fa-times"></i></button></div><div id="psicoConteudo"></div><button class="primary" id="prox" disabled><i class="fas fa-forward"></i> Próximo</button></div>`;
            document.body.appendChild(modal);
            function carregar() {
                const test = all[idx];
                if (test.sub === 'comp') {
                    document.getElementById('psicoConteudo').innerHTML = `<div class="comparacao-dupla"><div><img src="${test.imagem1_url}" style="max-width:100%;border-radius:8px"><p>Imagem 1</p></div><div><img src="${test.imagem2_url}" style="max-width:100%;border-radius:8px"><p>Imagem 2</p></div></div><p><strong>Qual a diferença entre as imagens?</strong></p><textarea id="resp" rows="3" placeholder="Digite sua resposta..."></textarea><button class="success mt-1" id="enviar"><i class="fas fa-paper-plane"></i> Enviar Resposta</button>`;
                } else if (test.sub === 'inter') {
                    document.getElementById('psicoConteudo').innerHTML = `<div><img src="${test.imagem_url}" style="max-width:100%;border-radius:8px"></div><p><strong>O que esta imagem representa? Descreva sua interpretação.</strong></p><textarea id="resp" rows="3" placeholder="Digite sua interpretação..."></textarea><button class="success mt-1" id="enviar"><i class="fas fa-paper-plane"></i> Enviar Resposta</button>`;
                } else {
                    document.getElementById('psicoConteudo').innerHTML = `<div><img src="${test.imagem_url}" style="max-width:200px;border-radius:8px"></div><p><strong>Qual é o país desta bandeira?</strong> <small class="text-muted">Dica: ${test.dica || 'Observe as cores'}</small></p><input id="resp" placeholder="Nome do país"><button class="success mt-1" id="enviar"><i class="fas fa-paper-plane"></i> Enviar Resposta</button>`;
                }
                let respondido = false;
                document.getElementById('enviar').onclick = () => {
                    if (respondido) return;
                    const resp = document.getElementById('resp').value.trim().toLowerCase();
                    if (resp.includes(test.resposta_esperada.toLowerCase()) || test.resposta_esperada.toLowerCase().includes(resp)) {
                        addPontosAtividade(candId, `${tipo}_${test.id}`, 0.5, true);
                        toast('+0.5% resposta correta!', 'success');
                        document.getElementById('psicoConteudo').innerHTML += '<div class="quiz-feedback correct" style="color:green;margin-top:10px;padding:10px;background:#e8f5e9;border-radius:8px"><i class="fas fa-check-circle"></i> ✅ Resposta correta!</div>';
                    } else {
                        addPontosAtividade(candId, `${tipo}_${test.id}`, 0, false);
                        document.getElementById('psicoConteudo').innerHTML += `<div class="quiz-feedback incorrect" style="color:red;margin-top:10px;padding:10px;background:#ffebee;border-radius:8px"><i class="fas fa-times-circle"></i> ❌ Resposta esperada: ${test.resposta_esperada}</div>`;
                    }
                    respondido = true;
                    modal.querySelector('#prox').disabled = false;
                };
                modal.querySelector('#prox').disabled = true;
            }
            carregar();
            modal.querySelector('#prox').onclick = () => { if (idx+1 < all.length) { idx++; carregar(); } else { marcarTreinoFeito(candId, tipo); toast('Testes psicotécnicos concluídos!', 'success'); modal.remove(); renderCandidato(); } };
            modal.querySelector('.modal-close').onclick = () => modal.remove();
        };

                toast('Candidato registado com sucesso!', 'success');

        function abrirCadastroRecrutador() {
            const modal = document.createElement('div'); modal.className = 'modal-overlay';

        function validarIdentificador(input) {
            const val = input.value.trim();
            const regraDiv = document.getElementById('regraBI');
            if (val.length > 0) {
                regraDiv.style.display = 'block';
                regraDiv.innerHTML = '<i class="fas fa-info-circle"></i> Para Recrutador: NIF com 10 números (ex:5000000001) <br>Para Candidatos: NIF com 12 números e 2 Letras (ex:123456789LA042)';
                const isAdmin = val === '0000ftc000';
                const isNIF = /^[0-9]{10}$/.test(val);
                input.style.borderColor = (isAdmin || isNIF) ? 'var(--success)' : 'var(--warning)';
            } else { regraDiv.style.display = 'none'; input.style.borderColor = ''; }
        }
